name: live

on:
  schedule:
    - cron: "0 3 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  live:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: tools/requirements.txt
      - name: Install pipeline dependencies
        run: pip install -r tools/requirements.txt
      - name: Fetch live data
        run: make live PY=python3
      - name: Validate content
        run: make validate PY=python3
      - name: Commit live.json if changed
        run: |
          if git diff --quiet -- content/live.json; then
            echo "content/live.json unchanged"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add content/live.json
          git commit -m "chore(live): refresh live data"
          git push
      # A push made with GITHUB_TOKEN does not trigger deploy.yml, so deploy here.
      - uses: ./.github/actions/build-deploy
        with:
          cloudflare-api-token: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          cloudflare-account-id: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
