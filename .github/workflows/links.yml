name: links

on:
  schedule:
    - cron: "0 4 * * 1"
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  links:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: tools/requirements.txt
      - name: Install pipeline dependencies
        run: pip install -r tools/requirements.txt
      - name: Check links
        run: |
          set -o pipefail
          make links PY=python3 2>&1 | tee links.txt
      - name: Open an issue with the report
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          {
            echo "Weekly link check failed — [run log]($GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID)."
            echo
            echo '```'
            head -c 60000 links.txt
            echo '```'
          } > issue.md
          gh issue create --title "Broken links $(date -u +%Y-%m-%d)" --body-file issue.md
